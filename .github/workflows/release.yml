name: Release Standalone Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.1)'
        required: false
        default: 'v1.0.0'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Desktop Application
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Release Tag
        id: release_info
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } elseif ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.version }}") {
            $tag = "${{ inputs.version }}"
          } else {
            $tag = "v1.0.0"
          }
          if (-not $tag.StartsWith("v") -and -not $tag.StartsWith("V")) {
            $tag = "v$tag"
          }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "clean_version=$($tag.TrimStart('v','V'))" >> $env:GITHUB_OUTPUT

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js with pnpm Cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Build Next.js Standalone
        run: pnpm run build
        env:
          DATABASE_URL: "file:./data/shifts.db"
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1

      - name: Compile Standalone Executable
        run: |
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /target:winexe /optimize+ /platform:anycpu "/win32icon:launcher\app.ico" "/win32manifest:launcher\app.manifest" /r:System.dll /r:System.Windows.Forms.dll /r:System.Drawing.dll "/out:TeamsShifts.exe" "launcher\Program.cs" "launcher\AssemblyInfo.cs"

      - name: Package Standalone App
        run: |
          New-Item -ItemType Directory -Path dist/TeamsShifts/app -Force | Out-Null
          New-Item -ItemType Directory -Path dist/TeamsShifts/data -Force | Out-Null
          New-Item -ItemType Directory -Path dist/TeamsShifts/runtime -Force | Out-Null

          # Copy binaries and assets
          Copy-Item "TeamsShifts.exe" "dist/TeamsShifts/TeamsShifts.exe"
          Copy-Item "launcher/app.ico" "dist/TeamsShifts/app.ico"
          Copy-Item "launcher/run-console.bat" "dist/TeamsShifts/run-console.bat"
          Copy-Item "launcher/stop.bat" "dist/TeamsShifts/stop.bat"
          Copy-Item "launcher/loading.html" "dist/TeamsShifts/loading.html"
          if (Test-Path "launcher/README.txt") {
            Copy-Item "launcher/README.txt" "dist/TeamsShifts/README.txt"
          } else {
            Copy-Item "README.md" "dist/TeamsShifts/README.txt"
          }

          # Copy compiled Next.js standalone server
          Copy-Item -Recurse ".next/standalone/*" "dist/TeamsShifts/app/"
          Copy-Item -Recurse ".next/static" "dist/TeamsShifts/app/.next/static"
          if (Test-Path "public") {
            Copy-Item -Recurse "public" "dist/TeamsShifts/app/public"
          }

          # Clean any dangling reparse points or broken symlinks if present
          Get-ChildItem -Path "dist/TeamsShifts" -Recurse -Force -ErrorAction SilentlyContinue | Where-Object {
            $_.LinkType -and (-not (Test-Path $_.FullName))
          } | Remove-Item -Force -Recurse -ErrorAction SilentlyContinue

          # Fix Node 22 module-sync export condition in ExcelJS dependencies
          $genReq = "import fn from './index.js';`r`nexport default fn;`r`nexport { fn as 'module.exports' };`r`n"
          foreach ($pkg in @("generator-function", "async-function")) {
            $pkgDir = "dist/TeamsShifts/app/node_modules/$pkg"
            if (Test-Path $pkgDir) {
              Set-Content -Path (Join-Path $pkgDir "require.mjs") -Value $genReq -NoNewline
              $pj = Join-Path $pkgDir "package.json"
              if (Test-Path $pj) {
                $pjContent = Get-Content $pj -Raw
                $pjContent = $pjContent -replace '"module-sync":\s*"[^"]*",?\s*', ''
                Set-Content -Path $pj -Value $pjContent -NoNewline
              }
            }
          }

          # Copy Node.js portable runtime
          $nodePath = (Get-Command node).Source
          Copy-Item $nodePath "dist/TeamsShifts/runtime/node.exe"

          # Copy template blank database
          Copy-Item "installer/template.db" "dist/TeamsShifts/data/shifts.db"

          # Create ZIP Archive (Portable Edition)
          Compress-Archive -Path "dist/TeamsShifts/*" -DestinationPath "TeamsShifts-Standalone.zip"

      - name: Build Windows Installer (Setup.exe)
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }
          $isccCandidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe",
            "C:\ProgramData\chocolatey\bin\iscc.exe",
            (Get-Command iscc -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -ErrorAction SilentlyContinue)
          )
          $iscc = $null
          foreach ($cand in $isccCandidates) {
            if ($cand -and (Test-Path $cand)) {
              $iscc = $cand
              break
            }
          }
          if (-not $iscc) {
            throw "ISCC.exe not found"
          }
          Write-Host "Using Inno Setup compiler: $iscc" -ForegroundColor Green
          $cleanVer = "${{ steps.release_info.outputs.clean_version }}"
          $absSource = (Resolve-Path "dist\TeamsShifts").Path
          $absIss = (Resolve-Path "installer\setup.iss").Path
          Write-Host "Compiling installer from $absIss with source $absSource..."
          & $iscc "/DAppVersion=$cleanVer" "/DSourceDir=$absSource" "$absIss"
          if ($LASTEXITCODE -ne 0) {
            throw "ISCC compilation failed with exit code $LASTEXITCODE"
          }

      - name: Generate Checksums
        run: |
          $files = @("dist/TeamsShifts-Setup.exe", "TeamsShifts-Standalone.zip")
          $lines = foreach ($f in $files) {
            if (Test-Path $f) {
              $h = Get-FileHash -Algorithm SHA256 $f
              "$($h.Hash.ToLower())  $(Split-Path $f -Leaf)"
            }
          }
          $lines | Out-File -Encoding ascii -FilePath "SHA256SUMS.txt"
          Write-Host "Generated SHA256SUMS.txt:" -ForegroundColor Green
          Get-Content "SHA256SUMS.txt"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TeamsShifts-Setup.exe
            TeamsShifts-Standalone.zip
            SHA256SUMS.txt
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: Release ${{ steps.release_info.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
