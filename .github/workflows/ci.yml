name: CI (Build & Type Check)

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Type Check & Next.js Build
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js with pnpm Cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: TypeScript Type Check
        run: pnpm exec tsc --noEmit

      - name: Next.js Production Build
        run: pnpm run build
        env:
          DATABASE_URL: "file:./data/shifts.db"
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1

      - name: Verify C# Launcher Compilation
        run: |
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /target:winexe /optimize+ /platform:anycpu "/win32icon:launcher/app.ico" "/win32manifest:launcher/app.manifest" /r:System.dll /r:System.Windows.Forms.dll /r:System.Drawing.dll "/out:TeamsShifts-Test.exe" launcher/Program.cs
          Remove-Item "TeamsShifts-Test.exe" -Force
